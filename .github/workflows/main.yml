name: Organize LeetCode files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize LeetCode folders
        run: |
          for dir in */; do
            if [ -f "${dir}question.md" ]; then
              mv "${dir}question.md" "${dir}README.md"
            fi

            if [ -f "${dir}notes.md" ]; then
              rm "${dir}notes.md"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Organize LeetCode files"
          git push
